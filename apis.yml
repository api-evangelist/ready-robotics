aid: ready-robotics
name: Ready Robotics
description: >-
  READY Robotics was a Columbus, Ohio industrial-automation software company, founded in 2016 out of
  Johns Hopkins University, that built Forge/OS — a universal operating system for industrial robots.
  Forge/OS presented one low-code programming and control surface across hundreds of robot models from
  ABB, Epson, FANUC, Kawasaki, Stäubli, Universal Robots and Yaskawa, and its Forge Edge product
  advertised a REST API with an OpenAPI/Swagger description plus client tooling for Python, JavaScript
  and C++, alongside the RAL2 (Robot Abstraction Layer 2) C++/Qt plugin interface used to write new
  robot drivers. The company ceased operations in August 2024 after a funding round collapsed, and its
  assets were liquidated through an assignment for the benefit of creditors. Every developer-facing
  host it operated — developer., docs., portal., market. and support.ready-robotics.com — no longer
  resolves in DNS, so no live machine-readable contract remains. What survives publicly is the
  marketing site behind a Cloudflare challenge and the GitHub organization, which still carries the
  RAL2 sample driver and the vendored C++ dependencies Forge/OS was built on.
