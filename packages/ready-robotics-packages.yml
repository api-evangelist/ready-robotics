note: >-
  READY Robotics published no client library to any public package registry. npm, PyPI and crates.io
  return nothing first-party (the unrelated `forgeos`, `@synctek/forgeos` and `forgeos-mcp` npm
  packages published in 2026 belong to other projects and are NOT this company's). The only
  first-party distributable that survives is source-distributed from GitHub: the RAL2 sample driver,
  a C++/Qt plugin template for writing Forge/OS robot drivers. Because it is not published to a
  registry, no registry metadata endpoint exists for it; the version below is read from the
  repository's own manifest.json and the date from the last push to its default branch. No `SDKs`
  pointer is emitted — this is a driver plugin template, not a client library for a callable API,
  and the company shipped no public API for a client to wrap.
